<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>⛏️ أبو سعد — كود نيمز أونلاين</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;
background:
radial-gradient(circle at 15% 20%,rgba(59,130,246,.28),transparent 28%),
radial-gradient(circle at 85% 15%,rgba(168,85,247,.24),transparent 30%),
radial-gradient(circle at 50% 90%,rgba(16,185,129,.18),transparent 32%),
linear-gradient(135deg,#070b16 0%,#111827 48%,#090d18 100%);
background-attachment:fixed;overflow-x:hidden}
header{padding:28px 18px 22px;text-align:center;
background:linear-gradient(180deg,rgba(4,8,20,.92),rgba(11,18,32,.72));
border-bottom:1px solid rgba(148,163,184,.18);box-shadow:0 12px 35px #0008;
backdrop-filter:blur(12px)}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);letter-spacing:-1px;
text-shadow:0 0 28px rgba(96,165,250,.35)}.sub{color:#b9c4d6;font-size:14px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:16px}
button{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 19px;
font-weight:800;cursor:pointer;background:rgba(30,41,59,.86);color:#fff;
box-shadow:0 8px 22px #0005;transition:.18s}
button:hover{filter:brightness(1.18);transform:translateY(-2px);box-shadow:0 12px 28px #0007}
#board{width:min(1120px,94vw);margin:0 auto 30px;display:grid;
grid-template-columns:repeat(5,1fr);gap:12px;padding:10px}
 .card{min-height:120px;border-radius:18px;background:linear-gradient(145deg,#f8fafc,#cbd5e1);
color:#111827;display:flex;align-items:center;justify-content:center;text-align:center;
font-size:21px;font-weight:900;padding:10px;cursor:pointer;transition:.2s;
box-shadow:0 8px 22px #0008, inset 0 1px 0 #fff9;border:1px solid rgba(255,255,255,.35)}
.card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 28px #0009}
.card.revealed{cursor:default;color:#fff}
.card.role-pop{animation:rolePop .7s cubic-bezier(.2,.9,.25,1.2) both;z-index:5}
@keyframes rolePop{
  0%{transform:scale(.82);filter:brightness(1);box-shadow:0 0 0 rgba(255,255,255,0)}
  45%{transform:scale(1.18);filter:brightness(1.35);box-shadow:0 0 45px rgba(255,255,255,.85)}
  75%{transform:scale(1.08);filter:brightness(1.18);box-shadow:0 0 32px rgba(255,255,255,.55)}
  100%{transform:scale(1);filter:brightness(1);box-shadow:0 8px 25px #0008}
}
.card.role-pop::after{
  content:"";
  position:absolute;inset:-4px;border-radius:22px;
  border:3px solid rgba(255,255,255,.9);
  animation:roleRing .7s ease-out both;
  pointer-events:none;
}
.card{position:relative}
@keyframes roleRing{
  0%{transform:scale(.75);opacity:1}
  100%{transform:scale(1.12);opacity:0}
}
 .blue{background:linear-gradient(145deg,#38bdf8,#2563eb);box-shadow:0 8px 25px #2563eb66}
.red{background:linear-gradient(145deg,#fb7185,#dc2626);box-shadow:0 8px 25px #dc262666}
.green{background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 8px 25px #16a34a66}
.neutral{background:linear-gradient(145deg,#94a3b8,#475569)}
.assassin{background:radial-gradient(circle,#202020,#000);box-shadow:0 0 30px #000}
#score{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 15px 18px}
.scorebox{padding:11px 17px;border-radius:14px;font-weight:900;box-shadow:0 7px 20px #0005}.sblue{background:#1683ff}.sred{background:#ef4444}.sgreen{background:#16a34a}
#turn{margin:0 auto 20px;width:max-content;max-width:90%;padding:11px 18px;
border-radius:14px;background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.2);
color:#dbeafe;box-shadow:0 8px 24px #0006;backdrop-filter:blur(10px)}
#clueDisplay{
  width:min(700px,92vw);margin:0 auto 18px;min-height:0;
  display:flex;justify-content:center;align-items:center;
  text-align:center;pointer-events:none;
}
.clue-bubble{
  display:inline-flex;align-items:center;gap:10px;
  max-width:100%;padding:12px 22px;border-radius:999px;
  background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 30px #0007;
  font-size:20px;font-weight:900;color:#fff;
  animation:clueIn .5s cubic-bezier(.2,.9,.25,1.2) both;
}
.clue-bubble .clue-icon{font-size:24px}
.clue-bubble .clue-text{overflow-wrap:anywhere}
@keyframes clueIn{
  0%{opacity:0;transform:translateY(12px) scale(.82)}
  60%{opacity:1;transform:translateY(-3px) scale(1.04)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@media(prefers-reduced-motion:reduce){
  .clue-bubble{animation:none}
}
@media(max-width:700px){#board{grid-template-columns:repeat(3,1fr)}.card{min-height:100px;font-size:17px}}
@media(max-width:430px){#board{grid-template-columns:repeat(2,1fr)}}

:root{--grass:#58a83a;--dirt:#7a4b2a;--stone:#777;--lava:#ff5a13;--ice:#7edcff;--nether:#8d2a52}
body{background:linear-gradient(#77b842 0 8px,#5a3824 8px 16px,#202020 16px 100%)!important;background-size:100% 16px!important;background-attachment:fixed!important}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 16px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 16px)}
header{background:linear-gradient(#4d9d32,#397c26)!important;border:4px solid #254d1c!important;border-radius:0!important;box-shadow:inset 0 4px #83d65c,inset 0 -5px #24481c,0 8px 0 #171717!important}
h1{font-family:Impact,"Arial Black",sans-serif;text-shadow:4px 4px 0 #26351f!important}
#abuSaadName{font-family:Impact,"Arial Black",sans-serif;text-align:center;font-size:clamp(32px,6vw,58px);letter-spacing:4px;margin:14px 0 4px;color:#fff;text-shadow:4px 4px 0 #3a2518}
button{border-radius:2px!important;border:3px solid #161616!important;background:#727272!important;box-shadow:inset 3px 3px #aaa,inset -3px -3px #3d3d3d,4px 4px 0 #111!important;transition:transform .08s steps(2),filter .08s!important}
button:hover{transform:translateY(-2px)!important;filter:brightness(1.12)}button:active{transform:translate(3px,3px)!important}
.card{border-radius:2px!important;border:4px solid #222!important;box-shadow:inset 4px 4px rgba(255,255,255,.35),inset -4px -4px rgba(0,0,0,.3),5px 5px 0 #111!important;font-family:Impact,"Arial Black",sans-serif;image-rendering:pixelated;transition:transform .12s steps(3),filter .12s!important}
.card:hover{transform:translateY(-5px)!important;filter:brightness(1.08)!important}
.card.role-pop{animation:blockReveal .5s steps(5) both!important}
@keyframes blockReveal{0%{transform:scale(.72);filter:brightness(.5)}35%{transform:scale(1.18);filter:brightness(1.7)}60%{transform:scale(.94)}100%{transform:scale(1);filter:brightness(1)}}
.card.revealed.red{background:repeating-linear-gradient(0deg,#7d130d 0 8px,#e9360c 8px 16px,#ff9b16 16px 23px,#d51c0a 23px 31px)!important;color:#fff!important;box-shadow:inset 4px 4px #ffcf45,inset -4px -4px #671008,0 0 20px #ff4b0c,0 0 50px #ff4b0c!important}
.card.revealed.blue{background:repeating-linear-gradient(135deg,#eaffff 0 8px,#8eeaff 8px 16px,#39a9e8 16px 24px,#bdf5ff 24px 32px)!important;color:#07354a!important;box-shadow:inset 4px 4px #fff,inset -4px -4px #1673a4,0 0 20px #69ddff,0 0 45px #69ddff!important}
.card.revealed.assassin{background:repeating-linear-gradient(90deg,#170b1a 0 8px,#3d0f31 8px 16px,#120813 16px 24px)!important;color:#ff8767!important;box-shadow:inset 4px 4px #71204d,inset -4px -4px #050306,0 0 25px #b21f55,0 0 55px #5d1539!important}
.card.revealed.neutral{background:repeating-linear-gradient(0deg,#666 0 8px,#888 8px 16px,#555 16px 24px)!important;color:#fff!important}
.card.revealed.red:before,.card.revealed.blue:before,.card.revealed.assassin:before{content:"";position:absolute;inset:0;pointer-events:none}
.card.revealed.red:before{background:linear-gradient(90deg,transparent,#fff2 48%,transparent);animation:lavaShine .45s steps(4) 1}
@keyframes lavaShine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.card.revealed.blue:before{background-image:radial-gradient(circle at 20% 30%,#fff 0 3px,transparent 4px),radial-gradient(circle at 75% 70%,#fff 0 2px,transparent 3px);animation:snowBurst .7s steps(5) 1}
@keyframes snowBurst{from{transform:scale(.3);opacity:0}35%{opacity:1}to{transform:scale(1.8);opacity:0}}
.card.revealed.assassin:before{background:repeating-linear-gradient(135deg,transparent 0 9px,#ff3b2e33 9px 12px);animation:portalPulse .8s steps(4) 1}
@keyframes portalPulse{0%,100%{opacity:.2}50%{opacity:1}}
#mcFX{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
#onlinePanel{width:min(760px,94vw);margin:12px auto 10px;padding:14px;border:4px solid #222;background:#3d3d3d;box-shadow:inset 4px 4px #777,inset -4px -4px #1d1d1d,5px 5px #111}
#roomInfo{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:900}
#roomCode{font-family:monospace;font-size:24px;letter-spacing:4px;background:#111;padding:8px 14px;border:2px solid #aaa}
#players{margin-top:8px;text-align:center;color:#eee}
#joinPanel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#joinPanel input{padding:11px;border:3px solid #222;background:#eee;color:#111;font-weight:800}
.status{margin:8px auto;text-align:center;font-weight:900}
</style>
</style>
</head>

<body>
<canvas id="mcFX"></canvas>
<div id="abuSaadName">⛏️ أبو سعد</div>
<header>
  <h1>🎯 كود نيمز — أبو سعد أونلاين</h1>
  <div class="sub">25 كلمة • 9 أزرق • 8 أحمر • 7 محايدة • 1 نذر • لعب جماعي لحظي</div>
</header>

<div id="onlinePanel">
  <div id="joinPanel">
    <input id="nameInput" maxlength="18" placeholder="اسمك">
    <input id="roomInput" maxlength="6" placeholder="كود الغرفة">
    <button id="createBtn" type="button">⛏️ إنشاء غرفة</button>
    <button id="joinBtn" type="button">🚪 دخول</button>
  </div>
  <div id="roomInfo" style="display:none">
    <span>الغرفة:</span><span id="roomCode"></span>
    <button id="shareBtn" type="button">🔗 نسخ رابط اللعب</button>
    <button id="newBtn" type="button" style="display:none">🎲 لعبة جديدة</button><button id="startBtn" type="button" style="display:none">▶️ ابدأ اللعبة</button>
  </div>
  <div id="players"></div>
  <div id="status" class="status">أنشئ غرفة أو ادخل بكود خويك.</div>
</div>

<div class="controls">
  <button id="keyBtn" type="button" style="display:none">🕵️ إظهار/إخفاء المفتاح</button>
</div>
<div id="score"></div>
<div id="turn">بانتظار دخول اللاعبين...</div>

<div id="cluePanel" style="width:min(700px,92vw);margin:0 auto 18px;padding:14px;border-radius:18px;background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.18);box-shadow:0 10px 28px #0006;">
  <div style="font-weight:900;margin-bottom:9px">💡 كلمة/تلميح هذا الدور</div>
  <div style="display:flex;gap:8px">
    <input id="clueInput" type="text" placeholder="اكتب التلميح..." style="flex:1;padding:12px 14px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px;outline:none">
    <button id="clueBtn" type="button">حفظ</button>
  </div>
  <div id="savedClue" style="margin-top:9px;color:#cbd5e1;font-weight:800"></div>
</div>
<div id="clueDisplay" aria-live="polite"></div>
<div id="board"></div>

<script>
const state = {
  ws:null, room:null, playerId:null, captain:false, keyVisible:false, started:false,
  cards:[], clue:"", lastReveal:-1
};

function esc(v){return String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;","'":"&#039;"}[ch]));}
function setStatus(t){document.getElementById("status").textContent=t}
function wsUrl(){
  const proto=location.protocol==="https:"?"wss":"ws";
  return proto+"://"+location.host;
}
function connect(onOpen){
  // Avoid the old 150ms race: Render/WebSocket can take longer than that.
  if(state.ws && (state.ws.readyState===WebSocket.OPEN || state.ws.readyState===WebSocket.CONNECTING)){
    if(state.ws.readyState===WebSocket.OPEN) onOpen?.();
    else state.ws.addEventListener("open",()=>onOpen?.(),{once:true});
    return;
  }
  state.ws=new WebSocket(wsUrl());
  state.ws.onopen=()=>{
    setStatus("🟢 متصل بالسيرفر");
    onOpen?.();
  };
  state.ws.onclose=()=>{
    setStatus("🔴 انقطع الاتصال — حدث الصفحة وحاول مرة ثانية");
  };
  state.ws.onerror=()=>setStatus("❌ تعذر الاتصال بالسيرفر");
  state.ws.onmessage=e=>{
    try{ handle(JSON.parse(e.data)); }
    catch(err){ console.error("Bad server message",err); }
  };
}
function send(msg){
  if(state.ws?.readyState===WebSocket.OPEN){
    state.ws.send(JSON.stringify(msg));
    return true;
  }
  setStatus("⏳ جاري الاتصال بالسيرفر...");
  return false;
}
function handle(m){
  if(m.type==="created"||m.type==="joined"){
    state.room=m.room; state.playerId=m.playerId; state.captain=m.captain;
    history.replaceState(null,"","?room="+encodeURIComponent(state.room));
    document.getElementById("joinPanel").style.display="none";
    document.getElementById("roomInfo").style.display="flex";
    document.getElementById("roomCode").textContent=state.room;
    document.getElementById("newBtn").style.display=state.captain?"inline-block":"none";
    document.getElementById("startBtn").style.display=state.captain && !state.started?"inline-block":"none";
    document.getElementById("keyBtn").style.display=state.captain?"inline-block":"none";
  }
  if(m.type==="error"){setStatus("❌ "+m.message);return}
  if(m.type==="state"){
    state.room=m.room; state.cards=m.cards; state.clue=m.clue||""; state.started=state.cards.length>0;
    state.captain=m.captain===state.playerId;
    document.getElementById("newBtn").style.display=state.captain?"inline-block":"none";
    document.getElementById("startBtn").style.display=state.captain && !state.started?"inline-block":"none";
    document.getElementById("keyBtn").style.display=state.captain?"inline-block":"none";
    render(m.revealIndex ?? -1);
    document.getElementById("players").textContent="👥 اللاعبين: "+m.players.map(p=>p.name+(p.captain?" 👑":"")).join(" • ");
    if(m.clue){
      document.getElementById("savedClue").textContent="💭 التلميح: "+m.clue;
      document.getElementById("clueDisplay").innerHTML='<div class="clue-bubble"><span class="clue-icon">💡</span><span class="clue-text">'+esc(m.clue)+'</span><span>✨</span></div>';
    }
    if(m.message)document.getElementById("turn").textContent=m.message;
  }
}
function render(pop=-1){
  const counts={blue:9,red:8};
  state.cards.forEach(c=>{if(c.revealed&&counts[c.role]!==undefined)counts[c.role]--});
  document.getElementById("score").innerHTML='<div class="scorebox sblue">🔵 الأزرق: '+counts.blue+'</div><div class="scorebox sred">🔴 الأحمر: '+counts.red+'</div>';
  document.getElementById("board").innerHTML=state.cards.map((c,i)=>{
    let role = (state.keyVisible && state.captain) ? c.role : (c.revealed ? c.role : "");
    let cls="card"+(c.revealed||role?" revealed ":"")+(role?" "+role:"")+(i===pop?" role-pop":"");
    return '<div class="'+cls+'" data-card-index="'+i+'" onclick="revealCard('+i+')">'+esc(c.word)+'</div>';
  }).join("");
}
function revealCard(i){
  if(!state.room || !state.cards[i] || state.cards[i].revealed)return;
  send({type:"reveal",index:i});
}
function saveClue(){
  const v=document.getElementById("clueInput").value.trim();
  if(!v||!state.room)return;
  send({type:"clue",value:v});
  document.getElementById("clueInput").value="";
}
function toggleKey(){
  state.keyVisible=!state.keyVisible;
  render();
  document.getElementById("turn").textContent=state.keyVisible?"🕵️ المفتاح ظاهر للقائد":"المفتاح مخفي";
}
function startGame(){if(state.captain){state.started=true; setStatus("🎮 بدأت اللعبة!"); render();}}
function newGame(){if(state.captain){state.started=true;send({type:"newGame"})}}
function spawnMinecraftFX(index,role){
  const card=document.querySelector('[data-card-index="'+index+'"]'); if(!card)return;
  const canvas=document.getElementById("mcFX"),ctx=canvas.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=card.getBoundingClientRect();
  const colors=role==="red"?["#ff3b0a","#ff9d1c","#ffd34d"]:role==="blue"?["#fff","#9cecff","#48b9ff"]:["#ff3b2e","#9b1d55","#4b1644"];
  const count=role==="assassin"?42:role==="neutral"?18:34;
  const ps=Array.from({length:count},()=>({x:r.left+r.width/2+(Math.random()-.5)*r.width*.45,y:r.top+r.height/2+(Math.random()-.5)*r.height*.25,vx:(Math.random()-.5)*4.8,vy:-(1.5+Math.random()*4.5),size:4+Math.random()*7,life:0,max:32+Math.random()*24,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3}));
  let f=0;function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);f++;ps.forEach(p=>{p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=role==="blue"?.08:.16;p.rot+=p.vr;const a=1-p.life/p.max;if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=colors[p.life%colors.length];ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()});if(f<60)requestAnimationFrame(tick);else ctx.clearRect(0,0,innerWidth,innerHeight)}requestAnimationFrame(tick);
  try{const A=window.AudioContext||window.webkitAudioContext;if(A){const ac=new A(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="square";const base=role==="red"?85:role==="blue"?520:120;o.frequency.setValueAtTime(base,ac.currentTime);o.frequency.exponentialRampToValueAtTime(role==="red"?42:role==="blue"?220:60,ac.currentTime+.16);g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.start();o.stop(ac.currentTime+.19)} }catch(e){}
}
document.getElementById("createBtn").onclick=()=>{
  const btn=document.getElementById("createBtn");
  const name=document.getElementById("nameInput").value.trim()||"لاعب";
  btn.disabled=true;
  setStatus("⏳ جاري إنشاء الغرفة...");
  connect(()=>send({type:"create",name}));
  setTimeout(()=>{btn.disabled=false},2500);
};
document.getElementById("joinBtn").onclick=()=>{
  const btn=document.getElementById("joinBtn");
  const name=document.getElementById("nameInput").value.trim()||"لاعب";
  const room=document.getElementById("roomInput").value.trim().toUpperCase();
  if(!room)return setStatus("اكتب كود الغرفة");
  btn.disabled=true;
  setStatus("⏳ جاري دخول الغرفة...");
  connect(()=>send({type:"join",name,room}));
  setTimeout(()=>{btn.disabled=false},2500);
};
document.getElementById("shareBtn").onclick=async()=>{const url=location.origin+location.pathname+"?room="+encodeURIComponent(state.room);try{await navigator.clipboard.writeText(url);setStatus("🔗 تم نسخ رابط الغرفة — ارسله لخويانك");}catch(e){prompt("انسخ الرابط:",url)}};
document.getElementById("keyBtn").onclick=toggleKey;
document.getElementById("newBtn").onclick=newGame;
document.getElementById("startBtn").onclick=startGame;
document.getElementById("clueBtn").onclick=saveClue;
document.getElementById("clueInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveClue()});
const roomFromUrl=new URLSearchParams(location.search).get("room");
if(roomFromUrl){document.getElementById("roomInput").value=roomFromUrl;setStatus("اكتب اسمك واضغط دخول للغرفة");}
</script>
</body>

</html>
